name: Build macOS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS universal2 (VST3 + AU + CLAP)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage bundles
        run: |
          mkdir -p dist
          cp -R build/Impact_artefacts/Release/VST3/Impact.vst3      dist/
          cp -R build/Impact_artefacts/Release/AU/Impact.component   dist/
          cp -R build/Impact_artefacts/Release/CLAP/Impact.clap      dist/

      - name: Create installer package (.pkg)
        run: |
          mkdir -p payload/Library/Audio/Plug-Ins/VST3
          mkdir -p payload/Library/Audio/Plug-Ins/Components
          mkdir -p payload/Library/Audio/Plug-Ins/CLAP
          cp -R dist/Impact.vst3      payload/Library/Audio/Plug-Ins/VST3/
          cp -R dist/Impact.component payload/Library/Audio/Plug-Ins/Components/
          cp -R dist/Impact.clap      payload/Library/Audio/Plug-Ins/CLAP/
          pkgbuild --root payload --identifier com.dewpoint.Impact --version 1.0.0 --install-location / Impact-1.0.0-mac.pkg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Impact-macOS
          path: |
            dist/**
            Impact-1.0.0-mac.pkg
